# Policy matrix: context_profile -> pii_type -> action.
# action in {REMOVE, MASK, KEEP, FLAG}.
#
# Matches the canonical matrix in the team workplan, section 3b. Values
# there are the agreed source of truth, not a P3 guess -- resolver.py just
# reads this file, no logic changes needed to retune it.
#
# REGULATED_KYC posture: no REMOVE actions in this column, by design.
# Government IDs (AADHAAR, DL, CREDIT_CARD) are MASKed rather than
# hard-deleted so a partial value stays visible for audit trail purposes
# during a regulated KYC check. PAN and the remaining fields (PHONE,
# EMAIL, NAME, ADDRESS) are KEPT outright since KYC processing needs
# them legible, not just present.

PUBLIC_DISCLOSURE:
  AADHAAR: REMOVE
  PAN: REMOVE
  DL: REMOVE
  CREDIT_CARD: REMOVE
  PHONE: REMOVE
  EMAIL: REMOVE
  NAME: REMOVE
  ADDRESS: REMOVE

THIRD_PARTY_SERVICE:
  AADHAAR: REMOVE
  PAN: REMOVE
  DL: MASK
  CREDIT_CARD: REMOVE
  PHONE: KEEP
  EMAIL: KEEP
  NAME: KEEP
  ADDRESS: MASK

REGULATED_KYC:
  AADHAAR: MASK
  PAN: KEEP
  DL: MASK
  CREDIT_CARD: MASK
  PHONE: KEEP
  EMAIL: KEEP
  NAME: KEEP
  ADDRESS: KEEP

INTERNAL_REVIEW:
  AADHAAR: FLAG
  PAN: FLAG
  DL: FLAG
  CREDIT_CARD: FLAG
  PHONE: FLAG
  EMAIL: FLAG
  NAME: FLAG
  ADDRESS: FLAG

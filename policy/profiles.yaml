# Policy matrix: context_profile -> pii_type -> action.
# action in {REMOVE, MASK, KEEP, FLAG}.
#
# Matches the canonical matrix in the team workplan, section 3b. Values
# there are the agreed source of truth, not a P3 guess -- resolver.py just
# reads this file, no logic changes needed to retune it.
#
# KNOWN OPEN ISSUE (REGULATED_KYC): section 3b's prose posture says "the
# ONE identifier the process legally requires is kept; every other
# identifier is removed" -- but its own matrix has zero REMOVE actions in
# this column (everything is MASK or KEEP). Left matching the literal
# matrix below since that's what's actually specified cell-by-cell, but
# this contradiction needs resolving with whoever owns section 3b before
# treating this row as final.

PUBLIC_DISCLOSURE:
  AADHAAR: REMOVE
  PAN: REMOVE
  DL: REMOVE
  CREDIT_CARD: REMOVE
  PHONE: REMOVE
  EMAIL: REMOVE
  NAME: REMOVE
  ADDRESS: REMOVE

THIRD_PARTY_SERVICE:
  AADHAAR: REMOVE
  PAN: REMOVE
  DL: MASK
  CREDIT_CARD: REMOVE
  PHONE: KEEP
  EMAIL: KEEP
  NAME: KEEP
  ADDRESS: MASK

REGULATED_KYC:
  AADHAAR: MASK
  PAN: KEEP
  DL: MASK
  CREDIT_CARD: MASK
  PHONE: KEEP
  EMAIL: KEEP
  NAME: KEEP
  ADDRESS: KEEP

INTERNAL_REVIEW:
  AADHAAR: FLAG
  PAN: FLAG
  DL: FLAG
  CREDIT_CARD: FLAG
  PHONE: FLAG
  EMAIL: FLAG
  NAME: FLAG
  ADDRESS: FLAG
